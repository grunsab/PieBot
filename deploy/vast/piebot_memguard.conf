[program:piebot_memguard]
command=/bin/bash /workspace/piebot_lc0v3_repo/scripts/vast_memory_guard.sh
directory=/workspace
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_memguard.out
stderr_logfile=/workspace/piebot_memguard.err
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
environment=GUARD_PROGRAM="piebot_lc0v3",GUARD_LIMIT_PCT="80"
