[program:piebot_training_72h_self_teacher]
directory=/workspace/piebot_rust
command=/workspace/piebot_rust/scripts/run_vast_5090_self_teacher_72h.sh
user=root
environment=PATH="/root/.cargo/bin:/venv/main/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",PYTHONUNBUFFERED="1",RUST_BACKTRACE="1"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=300
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
umask=0027
