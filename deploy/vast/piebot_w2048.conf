; Lineage w2048, founded 2026-10-30 on Vast (i9-13900KF, RTX 4090).
; Trainer: deploy/vast/run_w2048.sh. Watcher: checks and exports every
; checkpoint, gates every 200th against v3pw_bt4_1500 on the P-cores.
; Never install another trainer alongside this one (one GPU).
[program:piebot_w2048]
command=/bin/bash /workspace/piebot/deploy/vast/run_w2048.sh
directory=/workspace/piebot
autostart=true
autorestart=unexpected
exitcodes=0,2
startsecs=30
stopwaitsecs=300
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_w2048.log
stderr_logfile=/workspace/piebot_w2048.err
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

[program:piebot_w2048_watch]
command=/usr/bin/python3 /workspace/piebot/scripts/experiments/w2048_watch.py watch --out /workspace/w2048 --net-id w2048
directory=/workspace/piebot
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_w2048_watch.log
stderr_logfile=/workspace/piebot_w2048_watch.err
environment=PYTHONUNBUFFERED="1"
