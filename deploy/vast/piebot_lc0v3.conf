; LCZero lineage v3, founded 2026-10-08. It replaces lineage v2 so that the
; promotion gate plays on the engine without the S76 check-extension guard
; (commit 9d316d5); nothing else is meant to differ. It reuses v2's five frozen
; corpora where they are, so /workspace/piebot_lc0v2_20261004/data must stay.
; Weights are v2's last training checkpoint (chunk 3869) with fresh Adam, the
; traversal continues at v2's cursor 3870 with the same seed, and the learning
; rate is v2's schedule value after its 1,774,560,773 trained positions.
; Never install piebot_lc0v2.conf alongside this one (two trainers, one GPU).
[program:piebot_lc0v3]
command=/bin/bash /workspace/piebot_lc0v3_repo/scripts/run_vast_lc0.sh --reuse-corpus-manifest /workspace/piebot_lc0v2_20261004/data/corpus/corpus_manifest.json --reuse-corpus-manifest /workspace/piebot_lc0v2_20261004/data/window_01/corpus/corpus_manifest.json --reuse-corpus-manifest /workspace/piebot_lc0v2_20261004/data/window_02/corpus/corpus_manifest.json --reuse-corpus-manifest /workspace/piebot_lc0v2_20261004/data/window_03/corpus/corpus_manifest.json --reuse-corpus-manifest /workspace/piebot_lc0v2_20261004/data/window_04/corpus/corpus_manifest.json --initial-checkpoint /workspace/piebot_campaign_v8/lc0v3_bootstrap/lc0v2_chunk_00003869_checkpoint.json --initial-checkpoint-sha256 d014f0a880c21069417166218431056a48a4f9bfda89edea5e309bbb178b2b88 --initial-cursor 3870 --learning-rate 0.00040026471065457984 --lr-gamma 0.995 --lr-epoch-positions 100000000 --gate-movetime-ms 1000 --deadline-utc 2026-12-07T18:57:28+00:00
directory=/workspace/piebot_lc0v3_repo
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
stopwaitsecs=300
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_lc0v3_supervisor.log
stderr_logfile=/workspace/piebot_lc0v3_supervisor.err
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1",REPO_ROOT="/workspace/piebot_lc0v3_repo",OUT_ROOT="/workspace/piebot_lc0v3_20261008",HOURS="1560",EVICT_RAW="1",DISK_CAPACITY_GB="478",DOWNLOAD_CONCURRENCY="8",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
