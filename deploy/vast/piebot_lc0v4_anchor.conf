; Stockfish 16 limited-strength ladder (3000/3190, 60+0.5) for lineage v4,
; with PieBot on the network alone (EvalBlend 100). Runs from
; /workspace/piebot_engine_repo, a checkout separate from the trainer's pinned
; one; both build the same engine (uci sha 6bd5dfe8...). Results at EvalBlend
; 75 are in /workspace/piebot_anchor_unguard_20261008 and are not comparable.
[program:piebot_lc0v4_anchor]
command=/venv/main/bin/python /workspace/piebot_engine_repo/scripts/lc0_anchor_monitor.py --campaign-root /workspace/piebot_lc0v4_20261008 --out-root /workspace/piebot_anchor_fullnnue_20261008 --anchor /workspace/stockfish16 --baseline /workspace/piebot_campaign_v8/cycles/cycle_000168/nnue_quant.nnue
directory=/workspace/piebot_engine_repo
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/workspace/piebot_lc0v4_anchor.log
stderr_logfile=/workspace/piebot_lc0v4_anchor.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1"
