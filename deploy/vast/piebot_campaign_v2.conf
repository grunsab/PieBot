[program:piebot_campaign_v2]
command=/bin/bash /workspace/piebot_rust/scripts/run_vast_campaign_v2.sh
directory=/workspace/piebot_rust
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
stopwaitsecs=300
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_campaign_v2_supervisor.log
stderr_logfile=/workspace/piebot_campaign_v2_supervisor.err
environment=PYTHONUNBUFFERED="1",OUT_ROOT="/workspace/piebot_campaign_v6",TRAIN_ARCH="v2",HIDDEN_DIM="1024",FRESH_INIT="1",MIN_TEACHER_DEPTH="6",TEACHER_SAMPLE_FRACTION="0.15",RELABEL_DEPTH="9",RELABEL_EVERY="6",RELABEL_MAX_NODES="2500000",SELFPLAY_PARALLEL_GAMES="160",RELABEL_THREADS="160",RELABEL_HASH_MB="8192",SELFPLAY_DEPTH="5",TARGET_CP="250",INITIAL_ACTIVE_MODEL_SOURCE="/workspace/campaign_v3_bootstrap/cycle_000098_nnue_quant.nnue",VALIDATION_SHARD_SOURCE="/workspace/campaign_v3_bootstrap/validation/shard_000000.jsonl"
