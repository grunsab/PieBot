[program:piebot_campaign_v2]
command=/bin/bash /workspace/piebot_rust/scripts/run_vast_campaign_v2.sh
directory=/workspace/piebot_rust
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
stopwaitsecs=300
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_campaign_v2_supervisor.log
stderr_logfile=/workspace/piebot_campaign_v2_supervisor.err
environment=PYTHONUNBUFFERED="1",RELABEL_MAX_NODES="144000",SELFPLAY_PARALLEL_GAMES="160",RELABEL_THREADS="160",RELABEL_HASH_MB="8192",INITIAL_CHECKPOINT_SOURCE="/workspace/bootstrap_rescue/cycle_000086_checkpoint.json",INITIAL_ACTIVE_MODEL_SOURCE="/workspace/bootstrap_rescue/cycle_000098_nnue_quant.nnue",VALIDATION_SHARD_SOURCE="/workspace/bootstrap_rescue/validation/shard_000000.jsonl"
