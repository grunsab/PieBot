[program:piebot_campaign_v2]
command=/bin/bash /workspace/piebot_rust/scripts/run_vast_campaign_v2.sh
directory=/workspace/piebot_rust
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
stopwaitsecs=300
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_campaign_v2_supervisor.log
stderr_logfile=/workspace/piebot_campaign_v2_supervisor.err
environment=PYTHONUNBUFFERED="1",OUT_ROOT="/workspace/piebot_campaign_v8",TRAIN_ARCH="v2",HIDDEN_DIM="1024",FRESH_INIT="0",INITIAL_CHECKPOINT_SOURCE="/workspace/campaign_v8_bootstrap/cycle_000146_checkpoint.json",INITIAL_CHECKPOINT_SHA256="88d9344b0fff22cb132bb5e6a5381cc1f6691ff5364cce83f8dcfa0f7d231fe3",INITIAL_ACTIVE_MODEL_SOURCE="/workspace/campaign_v8_bootstrap/cycle_000146_nnue_quant.nnue",INITIAL_ACTIVE_MODEL_SHA256="67903f4eed96e78c44ff3de61ed91753705e0138051511b406b26166e050f976",INITIAL_ACTIVE_MODEL_BLEND_PERCENT="75",MIN_TEACHER_DEPTH="6",TEACHER_SAMPLE_FRACTION="1.0",TEACHER_MIX="0.9",CP_LOSS_WEIGHT="1.0",CROSS_ARCH_GATE_BLEND_PERCENT="100",RELABEL_DEPTH="7",RELABEL_EVERY="1",RELABEL_MAX_NODES="144000",SELFPLAY_PARALLEL_GAMES="112",RELABEL_THREADS="112",RELABEL_HASH_MB="8192",GATE_PARALLEL_GAMES="90",SELFPLAY_DEPTH="5",TARGET_CP="250",EPOCHS="1",BATCH_SIZE="16384",MAX_SAMPLES="5000000",VALIDATION_SHARD_SOURCE="/workspace/campaign_v3_bootstrap/validation/shard_000000.jsonl"

# campaign_v7 (2026-08-11). New lineage; v6 stopped after 90 cycles and 0
# promotions. What changed and why -- every number below was measured, see
# evidence/campaign_v6_root_cause_20260811.json:
#
#   OUT_ROOT + FRESH_INIT   v6's checkpoint was born from an uninitialized
#                           EmbeddingBag (N(0,1) summed over ~30 features =>
#                           7.3% of hidden units carried any gradient). Fixed
#                           in 931b2f3, but the fix only applies to a fresh
#                           init, so the old checkpoint cannot be salvaged.
#   CROSS_ARCH_GATE_...=100 THE deadlock: a candidate whose architecture
#                           differs from the active model restarted at blend
#                           25 forever, because the ramp only advances on an
#                           acceptance. v6 paid 100% of the NNUE cost for 25%
#                           of the eval for 90 cycles. arch-v2 is scale-
#                           calibrated (sd 43.1 cp vs PST 55.4) and is meant
#                           to stand alone, so it is judged at 100.
#   RELABEL_DEPTH 9 -> 7    Depth-9 relabeling was 86% of campaign compute and
#   MAX_NODES 2.5M -> 144k  bought 0.0021 nats while the net sat 0.0644 nats
#   EVERY 2 -> 1            from the floor. Depth 7 at 144k is the launcher's
#   SAMPLE_FRACTION -> 1.0  other pre-calibrated shape. ~74 min -> ~8 min per
#                           cycle, and every row gets a teacher label instead
#                           of half of them.
#   TEACHER_MIX 0.8 -> 1.0  At 0.8 a teacher row's target was 20% game outcome,
#                           injecting +/-49 cp of noise on equal positions and
#                           compressing a +1200 cp eval to +846. Objective
#                           identity, so it needs this new lineage anyway.
#   EPOCHS/BATCH/SAMPLES    v6 ran 154 optimizer steps per cycle for a
#                           41,946,113-parameter net, ~200x below standard.
#                           5M/3/16384 gives ~825 steps and ~13.5M
#                           sample-presentations per cycle, ~21x more, paid
#                           for by the relabel saving above.
#   *_THREADS 160 -> 112    Leaves ~48 threads for the search-arm A/B farm.
#                           The search track produced +56 Elo on 2026-08-11
#                           (S6) while 90 v6 cycles produced 0.
#
# WATCH ON FIRST CYCLE: the trainer's _pack_batch is pure Python, so the train
# stage may not absorb a 21x step increase cheaply. Measure the train stage's
# wall time in cycle 1 and tune MAX_SAMPLES/EPOCHS down if it dominates.
