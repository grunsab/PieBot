; RETIRED 2026-10-08: replaced by piebot_lc0v3_anchor.conf. Do not install it.
; Stockfish 16 limited-strength ladder (3000/3190, 60+0.5) for lineage v2.
; Runs from /workspace/piebot_engine_repo, a checkout separate from the
; trainer's pinned one. A new engine binary needs a new --out-root; results
; before 2026-10-08 (engine with the S76 check-extension guard) are in
; /workspace/piebot_lc0v2_20261004/anchor.
[program:piebot_lc0v2_anchor]
command=/venv/main/bin/python /workspace/piebot_engine_repo/scripts/lc0_anchor_monitor.py --campaign-root /workspace/piebot_lc0v2_20261004 --out-root /workspace/piebot_anchor_unguard_20261008 --anchor /workspace/stockfish16 --baseline /workspace/piebot_campaign_v8/cycles/cycle_000168/nnue_quant.nnue
directory=/workspace/piebot_engine_repo
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/workspace/piebot_lc0v2_anchor.log
stderr_logfile=/workspace/piebot_lc0v2_anchor.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1"
