; Carp / Lambergar / Schoenemann cohort (120+1, 400 games each) for lineage v4,
; with PieBot on the network alone (EvalBlend 100). The monitor and arena come
; from the ranked-tooling checkout (commit 2b64594, branch
; deploy/ranked-full-nnue). The engine under test is built in
; /workspace/piebot_engine_repo (uci sha 6bd5dfe8..., the same engine the
; trainer's gate uses). Results at EvalBlend 75 are in the older
; /workspace/piebot_ranked_* roots and are not comparable.
[program:piebot_lc0v4_ranked]
command=/venv/main/bin/python /workspace/piebot_ranked_repo/scripts/ranked_engine_monitor.py --piebot-bin /workspace/piebot_engine_repo/PieBot/target/release/uci --engine-root /workspace/ranked_engines_20261004 --campaign-root /workspace/piebot_lc0v4_20261008 --out-root /workspace/piebot_ranked_v4_20261008 --baseline /workspace/piebot_campaign_v8/cycles/cycle_000168/nnue_quant.nnue --book /workspace/piebot_ranked_repo/books/openings_v1.fen
directory=/workspace/piebot_ranked_repo
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/workspace/piebot_lc0v4_ranked.log
stderr_logfile=/workspace/piebot_lc0v4_ranked.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1"
