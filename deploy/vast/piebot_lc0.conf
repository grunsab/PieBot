[program:piebot_lc0]
command=/bin/bash /workspace/piebot_lc0_repo/scripts/run_vast_lc0.sh
directory=/workspace/piebot_lc0_repo
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
stopwaitsecs=300
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_lc0_supervisor.log
stderr_logfile=/workspace/piebot_lc0_supervisor.err
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1",REPO_ROOT="/workspace/piebot_lc0_repo",OUT_ROOT="/workspace/piebot_lc0_20260907",HOURS="336",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
