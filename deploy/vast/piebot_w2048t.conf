; Lineage w2048t (threat inputs), the second run of evidence/nnue_w2048_20261030.
; Install only after the plain w2048 run has finished (one GPU), and remove
; piebot_w2048.conf's trainer first. The watcher gates every 200th checkpoint
; against the best plain w2048 net (set INCUMBENT below before installing).
[program:piebot_w2048t]
command=/bin/bash /workspace/piebot/deploy/vast/run_w2048t.sh
directory=/workspace/piebot
autostart=true
autorestart=unexpected
exitcodes=0,2
startsecs=30
stopwaitsecs=300
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_w2048t.log
stderr_logfile=/workspace/piebot_w2048t.err
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

[program:piebot_w2048t_watch]
command=/usr/bin/python3 /workspace/piebot/scripts/experiments/w2048_watch.py watch --out /workspace/w2048t --net-id w2048t --threats --nets /workspace/w2048t_nets --gates /workspace/w2048t_gates --alert /workspace/w2048t_ALERT --engine /workspace/bin/uci_threats --incumbent /workspace/w2048_nets/INCUMBENT.nnue --incumbent-label w2048best
directory=/workspace/piebot
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_w2048t_watch.log
stderr_logfile=/workspace/piebot_w2048t_watch.err
environment=PYTHONUNBUFFERED="1"
