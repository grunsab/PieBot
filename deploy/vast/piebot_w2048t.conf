; Lineage w2048t (threat inputs), the second run of evidence/nnue_w2048_20261030.
; Install only after the plain w2048 run has finished (one GPU), and remove
; piebot_w2048.conf's trainer first. The watcher gates every 200th checkpoint
; against the best plain w2048 net, w2048-3000 (+35 Elo over v3pw_bt4_1500 at
; 10+0.1; 64% win-or-draw against SF19 for w2048-2400).
[program:piebot_w2048t]
command=/bin/bash /workspace/piebot/deploy/vast/run_w2048t.sh
directory=/workspace/piebot
autostart=true
autorestart=unexpected
exitcodes=0,2
startsecs=30
stopwaitsecs=300
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_w2048t.log
stderr_logfile=/workspace/piebot_w2048t.err
; Fine-tune from the finished plain net (owner's choice, 2026-10-31): a full
; 3000-superbatch run from scratch would take ~83 h at ~1.0M pos/s.
environment=INIT_FROM="/workspace/w2048/w2048-3000",SUPERBATCHES="800",LR="0.0003",FINAL_LR_FRAC="0.1"
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

[program:piebot_w2048t_watch]
command=/usr/bin/python3 /workspace/piebot/scripts/experiments/w2048_watch.py watch --out /workspace/w2048t --net-id w2048t --threats --nets /workspace/w2048t_nets --gates /workspace/w2048t_gates --alert /workspace/w2048t_ALERT --engine /workspace/bin/uci_threats --incumbent /workspace/w2048_nets/w2048-3000.nnue --incumbent-label w2048-3000
directory=/workspace/piebot
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_w2048t_watch.log
stderr_logfile=/workspace/piebot_w2048t_watch.err
environment=PYTHONUNBUFFERED="1"
