[program:piebot_lc0_anchor]
command=/venv/main/bin/python /workspace/piebot_lc0_repo/scripts/lc0_anchor_monitor.py
directory=/workspace/piebot_lc0_repo
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/workspace/piebot_lc0_anchor.log
stderr_logfile=/workspace/piebot_lc0_anchor.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1"
