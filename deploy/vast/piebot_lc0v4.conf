; LCZero lineage v4, founded 2026-10-08. It replaces lineage v3 so that the
; promotion gate plays both nets on the network alone (EvalBlend 100, the
; engine default since commit b6aa0be) instead of at 75. It reuses lineage v2's
; five frozen corpora where they are, so /workspace/piebot_lc0v2_20261004/data
; must stay. Weights are v3's last training checkpoint (chunk 389) with fresh
; Adam, the traversal continues at cursor 4260 of pass 0 with the same seed,
; and the learning rate is the schedule value v3 had reached.
; Never install an older lineage's conf alongside this one (one GPU).
[program:piebot_lc0v4]
command=/bin/bash /workspace/piebot_lc0v4_repo/scripts/run_vast_lc0.sh --reuse-corpus-manifest /workspace/piebot_lc0v2_20261004/data/corpus/corpus_manifest.json --reuse-corpus-manifest /workspace/piebot_lc0v2_20261004/data/window_01/corpus/corpus_manifest.json --reuse-corpus-manifest /workspace/piebot_lc0v2_20261004/data/window_02/corpus/corpus_manifest.json --reuse-corpus-manifest /workspace/piebot_lc0v2_20261004/data/window_03/corpus/corpus_manifest.json --reuse-corpus-manifest /workspace/piebot_lc0v2_20261004/data/window_04/corpus/corpus_manifest.json --initial-checkpoint /workspace/piebot_campaign_v8/lc0v4_bootstrap/lc0v3_chunk_00000389_checkpoint.json --initial-checkpoint-sha256 cce07354b44723b31d586454cec28b3de392cacca7814dc7d75739267559b43f --initial-cursor 4260 --learning-rate 0.0003967080433924763 --lr-gamma 0.995 --lr-epoch-positions 100000000 --gate-movetime-ms 1000 --deadline-utc 2026-12-07T18:57:28+00:00
directory=/workspace/piebot_lc0v4_repo
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
stopwaitsecs=300
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/piebot_lc0v4_supervisor.log
stderr_logfile=/workspace/piebot_lc0v4_supervisor.err
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1",REPO_ROOT="/workspace/piebot_lc0v4_repo",OUT_ROOT="/workspace/piebot_lc0v4_20261008",HOURS="1560",EVICT_RAW="1",DISK_CAPACITY_GB="478",DOWNLOAD_CONCURRENCY="8",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
