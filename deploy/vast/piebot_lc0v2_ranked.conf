; Carp / Lambergar / Schoenemann cohort (120+1, 400 games each) for lineage v2.
; The monitor and arena come from the ranked-tooling checkout (commit f7578a5,
; local branch deploy/ranked-f7578a5). The engine under test is built in
; /workspace/piebot_engine_repo, a checkout separate from the trainer's pinned
; one, so the engine can change without touching the training lineage. A new
; engine binary needs a new --out-root; results before 2026-10-08 (engine with
; the S76 check-extension guard) are in /workspace/piebot_ranked_v2_20261004.
[program:piebot_lc0v2_ranked]
command=/venv/main/bin/python /workspace/piebot_ranked_repo/scripts/ranked_engine_monitor.py --piebot-bin /workspace/piebot_engine_repo/PieBot/target/release/uci --engine-root /workspace/ranked_engines_20261004 --campaign-root /workspace/piebot_lc0v2_20261004 --out-root /workspace/piebot_ranked_unguard_20261008 --baseline /workspace/piebot_campaign_v8/cycles/cycle_000168/nnue_quant.nnue --book /workspace/piebot_ranked_repo/books/openings_v1.fen
directory=/workspace/piebot_ranked_repo
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/workspace/piebot_lc0v2_ranked.log
stderr_logfile=/workspace/piebot_lc0v2_ranked.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1"
