; Carp / Lambergar / Schoenemann cohort (120+1, 400 games each) for lineage v3.
; The monitor and arena come from the ranked-tooling checkout (commit f7578a5,
; local branch deploy/ranked-f7578a5). The engine under test is built in
; /workspace/piebot_engine_repo (uci sha eed3db2f..., the same engine the
; trainer's gate uses). The campaign root is part of this monitor's measurement
; configuration, so lineage v3 has its own output root and its own cycle-168
; baseline; /workspace/piebot_ranked_unguard_20261008 holds a part-finished
; baseline from the same engine.
[program:piebot_lc0v3_ranked]
command=/venv/main/bin/python /workspace/piebot_ranked_repo/scripts/ranked_engine_monitor.py --piebot-bin /workspace/piebot_engine_repo/PieBot/target/release/uci --engine-root /workspace/ranked_engines_20261004 --campaign-root /workspace/piebot_lc0v3_20261008 --out-root /workspace/piebot_ranked_v3_20261008 --baseline /workspace/piebot_campaign_v8/cycles/cycle_000168/nnue_quant.nnue --book /workspace/piebot_ranked_repo/books/openings_v1.fen
directory=/workspace/piebot_ranked_repo
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/workspace/piebot_lc0v3_ranked.log
stderr_logfile=/workspace/piebot_lc0v3_ranked.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1"
